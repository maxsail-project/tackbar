name: Product / Engineering Increment
description: Propose a focused TackBar product, UX, bug, research, analytics, operational, or engineering increment.
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Use this form, or these same section headings in Markdown when creating the Issue through a connector or API, to record a proposed increment. The form registers work; the preparation gate determines whether an increment is sufficiently defined to implement.

        Issue status describes definition maturity, not implementation authorization. Implementation requires explicit product-owner approval of the applicable delta or increment.

        Declare uncertainty rather than inventing facts: `Current baseline` may state `Not yet verified` and `Open decisions` may state `Not yet assessed`. Neither value is compatible with `Ready for implementation`. Leave non-applicable optional fields empty in the GitHub form. When creating Issues through a connector or API, omit non-applicable optional sections instead of filling them with `None`.

        Do not include private pilot data, credentials, access tokens, personal information, or sensitive operational details in public Issues.

        Issue conventions (apply after creation):
        - Rename ordinary Issues to `[#ID] Short English title` once GitHub assigns the Issue number.
        - Apply exactly one group label: `group:product`, `group:analytics`, or `group:operations`.
        - Add `bug` and/or `research` only when applicable; preserve any existing transverse labels.
        - Release preparation Issues retain their specialized `Prepare vX.Y.Z ...` title convention.
        - Do not use labels to duplicate Issue state, priority, or release assignment.

  - type: dropdown
    id: status
    attributes:
      label: Status
      description: |
        Select the definition maturity. This selection does not approve or authorize implementation.
        - Pending / proposed exploration: problem or investigation recorded; scope still being defined.
        - Pending product decision: relevant decisions remain open.
        - Ready for implementation: baseline verified, delta defined, essential decisions closed and acceptance criteria verifiable. For research, Ready means the question, scope and expected findings are defined; it does not authorize the investigation.
      options:
        - Pending / proposed exploration
        - Pending product decision
        - Ready for implementation
    validations:
      required: true

  - type: textarea
    id: problem_evidence
    attributes:
      label: Problem and evidence
      description: |
        State the focused problem and the real-sailing feedback, product or operational evidence, defect report, or implementation finding that motivates it. Distinguish observations from assumptions.
        - Bug: reproduction steps, observed behavior, and the violated contract, if confirmed.
        - Research: the question to answer and the evidence needed to answer it.
      placeholder: Include concrete observations, examples, screenshots, logs, or links where available.
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Explain the user, pilot, operational, or collaborative-debrief outcome sought, separately from the proposed scope. For a bug, state the expected behavior here.
    validations:
      required: true

  - type: textarea
    id: current_baseline
    attributes:
      label: Current baseline
      description: Record the relevant delivered behavior, current specifications, implementation, and tests where known. One line is enough for a small change.
      placeholder: Use "Not yet verified" when the baseline has not been checked.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: Define the smallest coherent increment and the adjacent work it excludes. Scope may be provisional while decisions remain open. Related work mentioned elsewhere is not included unless it is listed under In scope.
      placeholder: |
        In scope:
        - First included change

        Out of scope:
        - First excluded item
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints to preserve
      description: Record behavior, contracts, and semantics established before this Issue that must remain unchanged, such as APIs, persistence, consent, privacy, security, capability, ingestion, Session, Viewer, or operational semantics. Expected for Medium and High impact.

  - type: textarea
    id: closed_decisions
    attributes:
      label: Closed decisions
      description: List the product, UX, domain, technical, or operational decisions closed specifically for this Issue. Do not repeat existing contracts listed under Constraints to preserve.

  - type: textarea
    id: open_decisions
    attributes:
      label: Open decisions
      description: List the decisions that must be resolved before the Issue can be implemented safely. Use "Not yet assessed" during initial registration only. Resolve material decisions before marking Ready for implementation.
      placeholder: |
        Concrete pending decisions, or one of:
        None identified — reviewed against current baseline
        Not yet assessed
    validations:
      required: true

  - type: textarea
    id: preferred_direction
    attributes:
      label: Technical direction
      description: Describe a bounded implementation direction only when it is a real constraint on the solution. Do not turn the Issue into a Codex prompt.
      placeholder: Leave product decisions in Open decisions rather than resolving them through an implementation preference.

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: List observable, testable conditions for accepting the increment. For research, state the expected verdict and deliverable. Criteria may be refined before the increment is approved.
      placeholder: |
        - [ ] First acceptance criterion
        - [ ] Second acceptance criterion
    validations:
      required: true

  - type: dropdown
    id: governing_documentation
    attributes:
      label: Documentation impact — governing documentation
      description: Classify requirements/decision impact. Selection does not authorize documentation changes.
      options:
        - No impact
        - Review required
        - Change required before implementation
    validations:
      required: true

  - type: dropdown
    id: release_documentation
    attributes:
      label: Documentation impact — release-facing documentation
      description: Classify README, ROADMAP, CHANGELOG, release-note, or similar release-facing review.
      options:
        - No impact
        - Review during Release Preparation
    validations:
      required: true

  - type: dropdown
    id: post_deployment_documentation
    attributes:
      label: Documentation impact — post-deployment documentation
      description: Classify documentation that depends on actual production deployment evidence.
      options:
        - No impact
        - Review after production deployment
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: Provisional estimate of implementation risk and review depth. If it falls between two levels, select the higher one. The implementation prompt sets the final impact of each increment.
      options:
        - Low
        - Medium
        - High
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Describe the overall automated, manual, documentation, or operational validation expected. Expected for Medium and High impact; the implementation prompt specifies each increment.
      placeholder: |
        Describe risk-proportionate validation when known.
        Full regression only when justified; otherwise determined
        during increment preparation.

  - type: textarea
    id: references
    attributes:
      label: References / related Issues
      description: Link relevant requirements, decisions, implementation evidence, completed Issues, pending related Issues, and affected documents, without promoting them. Listing a document here does not authorize edits.
