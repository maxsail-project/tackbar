name: Deploy Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to deploy, for example v0.6.2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout deployment tooling
        uses: actions/checkout@v5

      - name: Resolve and validate GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$RELEASE_TAG"

          release_json="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease)"

          test "$(jq -r '.tagName' <<<"$release_json")" = "$RELEASE_TAG"
          test "$(jq -r '.isDraft' <<<"$release_json")" = false
          test "$(jq -r '.isPrerelease' <<<"$release_json")" = false

          if [ "$GITHUB_EVENT_NAME" = release ]; then
            source="automatic release"
          else
            source="manual"
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"

          echo "Deployment source: $source"
          echo "Release: $RELEASE_TAG"

      - name: Configure pinned SSH host verification
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail

          install -d -m 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy exact release tag
        env:
          TARGET_TAG: ${{ steps.release.outputs.tag }}
          DEPLOYMENT_SOURCE: ${{ steps.release.outputs.source }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$SSH_HOST"
          test -n "$SSH_USER"

          port="${SSH_PORT:-22}"

          echo "Deployment source: $DEPLOYMENT_SOURCE"
          echo "Release: $TARGET_TAG"

          ssh \
            -p "$port" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "bash -s -- $(printf '%q' "$TARGET_TAG")" \
            < scripts/deploy-production.sh

          {
            echo "## Production deployment"
            echo
            echo "- Deployment source: $DEPLOYMENT_SOURCE"
            echo "- Release: $TARGET_TAG"
            echo "- Frontend: published"
            echo "- Backend: restarted"
            echo "- Health: OK"
            echo "- Production: $TARGET_TAG"
          } >> "$GITHUB_STEP_SUMMARY"
           