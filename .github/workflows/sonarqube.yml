name: SonarQube

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements.txt pytest-cov

      - name: Run backend tests with coverage
        id: backend_tests
        working-directory: backend
        env:
          TACKBAR_DATA_DIR: ${{ runner.temp }}/tackbar-backend-linux-data
          TACKBAR_MAILBOX_PROVIDER: ovh
        run: |
          mkdir -p "$TACKBAR_DATA_DIR"
          python -m pytest tests -q -ra --cov=app --cov-report=xml:coverage.xml \
            --junitxml="$RUNNER_TEMP/backend-sonarqube-results.xml"

      - name: Publish backend test summary
        if: always()
        env:
          REPORT_PATH: ${{ runner.temp }}/backend-sonarqube-results.xml
          TEST_OUTCOME: ${{ steps.backend_tests.outcome }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path(os.environ['REPORT_PATH'])
          lines = ['## Backend pytest results', '']
          valid_report = False
          if report.is_file():
              try:
                  cases = ET.parse(report).getroot().findall('.//testcase')
                  if cases:
                      valid_report = True
                      failed = sum(case.find('failure') is not None or case.find('error') is not None for case in cases)
                      skipped = sum(case.find('skipped') is not None for case in cases)
                      passed = len(cases) - failed - skipped
                      lines.extend([
                          '| Total | Passed | Failed / errors | Skipped |',
                          '| ---: | ---: | ---: | ---: |',
                          f'| **{len(cases)}** | **{passed}** | **{failed}** | **{skipped}** |',
                      ])
                  else:
                      lines.append('JUnit XML contains no test cases; check the pytest logs.')
              except (ET.ParseError, OSError) as exc:
                  lines.append(f'JUnit XML is unreadable: {exc}')
          else:
              lines.append('JUnit XML was not generated; check the pytest logs.')

          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as summary:
              summary.write('\n'.join(lines) + '\n')
          if os.environ['TEST_OUTCOME'] == 'success' and not valid_report:
              raise SystemExit('Pytest succeeded but the JUnit report is absent, invalid, or empty.')
          PY

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm run test -- --coverage.enabled --coverage.reporter=lcov

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Check coverage reports
        run: |
          test -s backend/coverage.xml
          test -s frontend/coverage/lcov.info

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Build production frontend
        working-directory: frontend
        run: npm run build
