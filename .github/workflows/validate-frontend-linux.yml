name: Validate Frontend (Linux)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-validation:
    name: Frontend tests, typecheck and build on Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        id: install
        run: npm ci

      - name: Run complete frontend test suite
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run test -- \
            --reporter=default \
            --reporter=junit \
            --outputFile.junit="$RUNNER_TEMP/frontend-linux-results.xml"

      - name: Typecheck frontend
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Build production frontend
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      - name: Upload JUnit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-linux-junit
          path: ${{ runner.temp }}/frontend-linux-results.xml
          if-no-files-found: warn
          retention-days: 7
