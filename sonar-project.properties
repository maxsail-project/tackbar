sonar.projectKey=maxsail-project-oss_tackbar
sonar.organization=maxsail-project-oss
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
sonar.python.version=3.14
sonar.sources=.
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.tests=backend/tests,frontend/src,frontend/tests,tests
sonar.test.inclusions=backend/tests/*.py,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/tests/*.mjs,tests/*.py
